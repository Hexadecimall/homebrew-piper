name: bottles

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  PIPER_BOTTLE_TAG: v0.1.3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            formula: piper
            platform: arm64-macos-static
          - runner: macos-15
            formula: piper-dynamic
            platform: arm64-macos-dynamic
          - runner: ubuntu-24.04
            formula: piper
            platform: x86_64-linux-static
          - runner: ubuntu-24.04
            formula: piper-dynamic
            platform: x86_64-linux-dynamic
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: Homebrew/actions/setup-homebrew@3b81d438eda92ee13b5849940d993be027717ecf
      - name: Install tap
        run: brew trust Hexadecimall/piper
      - name: Build bottle
        run: |
          brew install --build-bottle Hexadecimall/piper/${{ matrix.formula }}
          brew test Hexadecimall/piper/${{ matrix.formula }}
          mkdir bottles
          cd bottles
          brew bottle --json \
            --root-url=https://github.com/${{ github.repository }}/releases/download/$PIPER_BOTTLE_TAG \
            Hexadecimall/piper/${{ matrix.formula }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bottle-${{ matrix.platform }}
          path: bottles/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          pattern: bottle-*
          merge-multiple: true
      - name: Normalize bottle asset names
        run: |
          for asset in *--*.tar.gz; do
            mv "$asset" "${asset/--/-}"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ env.PIPER_BOTTLE_TAG }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.json
